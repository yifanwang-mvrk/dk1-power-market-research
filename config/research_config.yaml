project:
  name: DK1 Short-Term Power Market Research
  version: mvp-v1
  price_area: DK1
  resolution: PT1H

periods:
  development:
    start_date: "2022-01-01"
    end_date_inclusive: "2024-06-30"
  holdout:
    start_date: "2024-07-01"
    end_date_inclusive: "2024-12-31"
    state: locked
    fetch_allowed: false
  boundary_timezone: Europe/Copenhagen

target:
  name: balancing_spread
  formula: balancing_price_eur_mwh - day_ahead_price_eur_mwh
  unit: EUR/MWh
  day_ahead_source_dataset: Elspotprices
  day_ahead_source_field: SpotPriceEUR
  balancing_source_dataset: RegulatingBalancePowerdata
  balancing_source_field: ImbalancePriceEUR
  labels:
    up: spread > delta
    down: spread < -delta
    neutral: abs(spread) <= delta

neutral_band:
  primary_quantile: 0.25
  population: nonzero_absolute_development_spreads
  numerical_delta: 5.9956075
  unit: EUR/MWh
  status: frozen
  frozen_at_utc: "2026-09-06T14:22:34Z"
  quantile_method: linear
  calculation: pandas.Series.quantile
  calculation_versions:
    pandas: 3.0.5
    numpy: 2.5.2
  sample:
    start_date: "2022-01-01"
    end_date_inclusive: "2024-06-30"
    valid_spreads: 21886
    missing_spreads: 1
    zero_spreads_excluded: 6494
    nonzero_absolute_spreads: 15392
  interpolation_audit:
    zero_based_position: 3847.75
    lower_value: 5.990005
    upper_value: 5.997475
    upper_weight: 0.75
  input_file: data/processed/p2/hourly_base_development.parquet
  input_sha256: cb69be3091d71e27a157ec3e529878cfaed74f3d9f734ebaa9db56d3a695e66d
  holdout_may_influence: false

point_in_time:
  required_classes:
    - decision_eligible
    - diagnostic_only
    - outcome
  decision_cutoff:
    anchor: delivery_start_utc
    offset_minutes: 0
    availability_rule: strictly_before_anchor
    interpretation: last_pre_delivery_information_snapshot
    executable_intraday_claim: false
  timestamp_contract:
    canonical_join_key: delivery_start_utc
    local_timezone: Europe/Copenhagen
    source_hour_dk_use: validation_and_interpretation_only
    repeated_dst_hours: preserve_as_distinct_utc_rows

source_eligibility:
  renewable_fixed_horizon_forecasts:
    dataset: Forecasts_Hour
    fields:
      - Forecast5Hour
      - Forecast1Hour
    class: decision_eligible
    eligibility_rule: non_null_same_delivery_hour_at_last_pre_delivery_snapshot
    vintage_claim: fixed_horizon_only
  actual_residual_load:
    dataset: ProductionConsumptionSettlement
    fields:
      demand: GrossConsumptionMWh
      wind:
        - OffshoreWindLt100MW_MWh
        - OffshoreWindGe100MW_MWh
        - OnshoreWindLt50kW_MWh
        - OnshoreWindGe50kW_MWh
      solar:
        - SolarPowerLt10kW_MWh
        - SolarPowerGe10Lt40kW_MWh
        - SolarPowerGe40kW_MWh
        - SolarPowerSelfConMWh
    class: diagnostic_only
  cross_border_day_ahead:
    dataset: Transmissionlines
    fields:
      - ImportCapacity
      - ExportCapacity
      - ScheduledExchangeDayAhead
    class: decision_eligible_candidate
    timing_status: passed_at_last_pre_delivery_cutoff
    border_handling_gate: P6.1
  realized_exchange:
    dataset: ProductionConsumptionSettlement
    class: diagnostic_only
  countertrade:
    dataset: CountertradeIntraday
    class: conditional_decision_candidate
    development_coverage_start: "2023-04-18"
    row_eligibility_rule: publication_time_utc < delivery_start_utc
    historical_version_limit: prior_overwritten_versions_unavailable
    absence_means_zero: false
  load_forecast_proxy:
    dataset: ENTSO-E day-ahead total load forecast
    class: external_candidate_pending_access_timing
    eligibility_gate: P5.2
    status: still_pending_external_access  # I06
  residual_load_known_proxy:
    definition: consumption_climatology_mwh - renewable_forecast_5h_mwh
    class: decision_eligible
    components:
      consumption_climatology: point_in_time expanding mean of actual_gross_consumption over prior same-(local_weekday, local_hour) occurrences, lagged 3 occurrences past the settlement delay
      renewable_forecast_5h: forecast_5_hour offshore + onshore + solar
    registration_status: ELIGIBLE_INTERIM_PROXY  # P5.2 / D031
    coverage_hours: 21184
    tracks_actual_residual_load_spearman: 0.92
    spread_association_spearman: 0.042
    use: eligible input for the P7 signal engine, not a standalone signal
    supersede_when: ENTSO-E day-ahead load forecast becomes available (I06)

baselines:
  majority_class:
    enabled: true
    class_source: training_sample_only
  persistence:
    enabled: true
    formula: predicted_label_t = observed_label_t_minus_1
    availability_status: ex_post_reference_only
    reason: legacy_outcome_publication_delay_not_documented
    decision_feature_eligible: false
    availability_correct_alternative_gate: resolved_at_P3.4
  availability_safe_supplemental:
    enabled: true
    name: hour_of_week_training_majority
    formula: most_common_training_label_for_local_weekday_and_hour
    fallback: global_training_majority
    fit_scope: training_rows_only
    decision_inputs: local_weekday_and_local_hour
    decision_feature_eligible: true
    status: registered_before_evaluation

hypotheses:
  H1: residual_load_and_system_tightness
  H2: renewable_forecast_revision
  H3: cross_border_and_system_conditions
  primary_mvp_hypothesis: H2

signal_engine:  # P7 / D033 — transparent rule, research judgment only (D016)
  status: round_1_frozen
  inputs: [wind_revision_mwh, wind_forecast_5h_mwh, residual_load_known_mwh]
  thresholds_pre_declared:
    h2_strong_abs_revision_cut_mwh: 222.6  # top 20% of abs(wind_revision), development
    low_wind_cut_mwh: 861.430541           # P4.4 wind_forecast_5h bottom tercile (H2 blind spot)
    rl_tight_cut_mwh: 1855.7               # top 20% of residual_load_known, development
  rules:
    h2_view: DOWN if wind_revision > h2_strong_cut and wind_forecast_5h > low_wind_cut; else none (never UP)
    h1_view: UP if residual_load_known > rl_tight_cut; else none (never DOWN)
    combination: DOWN PRESSURE/MEDIUM if h2 DOWN and h1 not tight; UP PRESSURE/LOW if h1 tight and h2 silent; NO TRADE on conflict, silence or missing input
  confidence_scale: [Low, Medium, High]
  high_confidence_available: false
  coverage_active_share_development: 0.327
  down_pressure_realized_down_rate: 0.400  # vs 0.329 base rate

claims:
  executable_intraday_pnl: false
  causal_effects: false
  complete_tick_by_tick_vintages: false
  deployable_signal_edge: false
